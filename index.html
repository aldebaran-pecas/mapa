<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mapa Aparelhos">
<meta name="theme-color" content="#161a19">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<title>Mapa dos Aparelhos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de tela cheia — mapa 3D à direita, lista/detalhe à esquerda; no celular o mapa fica em cima e o painel embaixo */
:root{
  --bg:#eef0ee; --panel:#fbfbf9; --fg:#1d2321; --muted:#5f6a66; --line:#d5dad7; --chip:#e7eae7;
  --accent:#f2c230; --accent-ink:#2a2306;
  --st-aguardando:#e3b00e; --st-orcamento:#2f6fb5; --st-pronto:#2e9e5b; --st-descarte:#d14343; --st-teste:#e8742a;
  --scene:#e9ebe8; --floor:#d8c3a2; --wall:#f3f3f0; --shelf-white:#eeeeea; --shelf-wood:#7a5236;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161a19; --panel:#1d2221; --fg:#e8ece9; --muted:#9aa6a1; --line:#2f3634; --chip:#272d2b;
  --scene:#1b201f; --floor:#6e5d45; --wall:#2a302e; --shelf-white:#c9cbc6; --shelf-wood:#6a4730; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a19; --panel:#1d2221; --fg:#e8ece9; --muted:#9aa6a1; --line:#2f3634; --chip:#272d2b;
  --scene:#1b201f; --floor:#6e5d45; --wall:#2a302e; --shelf-white:#c9cbc6; --shelf-wood:#6a4730; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.list,.detail,aside{padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:360px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px}
.tape{width:26px;height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--accent-ink) 6px 9px);border-radius:1px}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.demo{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:3px}
.hdr-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;border-radius:7px;padding:7px 12px;border:1px solid var(--line);background:var(--chip);color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.btn.danger{background:var(--st-descarte);color:#fff;border-color:var(--st-descarte)}

aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.search{padding:12px 16px 8px;display:grid;gap:8px}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip.total{background:var(--fg);color:var(--panel);border-color:var(--fg);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:transparent}
.chip[aria-pressed="false"]{opacity:.45}
.chip b{font-family:var(--f-mono);font-size:12px}
.tipos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tipo{font:inherit;font-size:14px;padding:7px 12px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tipo.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 6px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.ordem{margin-left:auto;align-self:center;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer}
.list{flex:1;overflow:auto;padding:6px 8px 12px;display:flex;flex-direction:column;gap:2px;min-height:0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px}
.item:hover{background:var(--chip)}
.item.sel{background:var(--chip);border-color:var(--accent)}
.item .dot{grid-row:1/3;width:12px;height:12px}
.item .os{font-family:var(--f-mono);font-weight:600;font-size:14px}
.item .sub{grid-column:2;font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc{grid-row:1/3;grid-column:3;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.03em;background:var(--fg);color:var(--panel);padding:3px 8px;border-radius:4px;white-space:nowrap}
.empty{padding:16px;color:var(--muted);font-size:14px}
.diaBar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.diaBar input{font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:6px 8px;color-scheme:light dark}
.alerta90{display:block;width:calc(100% - 32px);margin:8px 16px 0;text-align:left;font:inherit;font-size:14px;font-weight:600;color:#fff;background:#b83232;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
.alerta90[aria-pressed="true"]{outline:2px solid var(--fg)}
.item.velho{border-color:#d14343;animation:piscar 1.1s ease-in-out infinite}
.item.velho .sub b{color:#e05656}
@keyframes piscar{50%{background:rgba(209,67,67,.28)}}
@media (prefers-reduced-motion:reduce){.item.velho{animation:none;background:rgba(209,67,67,.2)}}
.aviso90{margin:8px 0;padding:8px 10px;border-radius:8px;background:rgba(209,67,67,.18);border:1px solid #d14343;font-size:14px}

.detail{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:10px;max-height:58%;overflow:auto}
.k{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.d-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.d-head h2{margin:0;font-size:18px;font-weight:600}
.d-os{font-family:var(--f-mono);font-weight:600;font-size:15px}
.where{display:flex;align-items:center;gap:10px}
.where .big{font-family:var(--f-display);font-weight:700;font-size:30px;white-space:nowrap;line-height:1;letter-spacing:.02em}
.where .txt{font-size:14px;color:var(--muted);line-height:1.3}
.stbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stbtns .stb:last-child:nth-child(odd){grid-column:1/-1}
.stb{display:flex;align-items:center;gap:8px;text-align:left;font-size:14px;font-weight:500;padding:9px 10px;border-radius:8px;border:2px solid var(--line);background:transparent}
.stb[aria-pressed="true"]{border-color:currentColor;font-weight:600}
.stb .dot{width:14px;height:14px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:var(--chip)}
.addph{width:64px;height:64px;border-radius:6px;border:1px dashed var(--muted);display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;cursor:pointer;line-height:1.1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.fotobtns{display:flex;gap:8px;margin-bottom:8px}
.fotobtns .btn{flex:1;text-align:center;padding:10px 12px;cursor:pointer}
.confirm{background:var(--chip);border-radius:8px;padding:10px;display:grid;gap:8px;font-size:14px}

main{position:relative;min-width:0;min-height:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tip{position:absolute;pointer-events:none;font-family:var(--f-display);font-weight:600;font-size:14px;background:var(--fg);color:var(--panel);padding:3px 8px;border-radius:4px;transform:translate(-50%,-140%);white-space:nowrap}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--fg);color:var(--panel);border-radius:8px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;font-weight:500;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box}
.banner span{flex:1}
.banner .btn{padding:6px 12px;font-size:13px;background:var(--panel);color:var(--fg);border-color:var(--panel);white-space:nowrap}
.note{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);max-width:230px;text-align:right;background:color-mix(in srgb,var(--panel) 88%,transparent);padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
.views{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.views .btn{font-size:13px;padding:5px 10px;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.views{right:12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.views::-webkit-scrollbar{display:none}.views .btn{white-space:nowrap;flex:none}
@media (max-width:480px){.views{gap:4px;left:8px;right:8px}.views .btn{font-size:12px;padding:5px 7px}}

.overlay{position:fixed;inset:0;background:rgba(10,14,13,.55);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border-radius:12px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;display:grid;gap:14px;box-sizing:border-box}
.sheet h3{margin:0;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.field{display:grid;gap:5px}
.field label{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{font:inherit;font-size:16px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick .loc{grid-row:auto;grid-column:auto;white-space:normal;font-size:15px}
.err{color:var(--st-descarte);font-size:14px;margin:0}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:grid;place-items:center}
.viewer img{max-width:94vw;max-height:84vh;border-radius:6px}
.viewer .bar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.viewer .nav{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;color:#fff;align-items:center}
.viewer .btn{background:#fff;color:#111;border-color:#fff}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockbox{width:min(360px,100%);display:grid;gap:12px;text-align:center;justify-items:center}
.lockbox h3{margin:0;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.lockbox p{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.lockbox input{width:100%;box-sizing:border-box;font:inherit;font-family:var(--f-mono);font-size:28px;letter-spacing:.3em;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.lockbox .btn{width:100%;padding:12px;font-size:17px}
.tape.lk{width:64px;height:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--st-descarte);color:#fff;padding:10px 14px;border-radius:8px;z-index:40;max-width:calc(100% - 32px);font-weight:500}

@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(240px,44%) minmax(0,1fr)}
  .hm{display:none} .brand{min-width:0} h1{overflow:hidden;text-overflow:ellipsis} .tape{flex:none} .where{flex-wrap:wrap}
  main{grid-row:2} aside{grid-row:3;border-right:0;border-top:1px solid var(--line)}
  .note{display:none} h1{font-size:18px;white-space:nowrap}
  header{flex-wrap:nowrap} .hdr-actions .btn{font-size:14px;padding:7px 10px;white-space:nowrap}
  .detail{max-height:none;flex:none}
  aside{overflow:auto} .list{flex:none;max-height:none;overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>


<div class="app">
  <header>
    <div class="brand"><span class="tape" aria-hidden="true"></span><h1>Mapa dos Aparelhos</h1><span class="demo" id="modo">Exemplo</span><span class="k" id="sync"></span></div>
    <div class="hdr-actions"><button class="btn primary" id="bReceber">+ Receber<span class="hm"> aparelho</span></button></div>
  </header>

  <aside>
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Digite o número da OS" aria-label="Buscar OS">
      <div class="chips" id="chips"></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tLoja" aria-selected="true">Na loja</button>
      <button class="tab" role="tab" id="tRet" aria-selected="false">Retirados</button>
      <button class="tab" role="tab" id="tDia" aria-selected="false">Por dia</button>
      <button class="ordem" id="bOrdem" type="button" title="Ordem da lista: OS antigas ou novas primeiro"></button>
    </div>
    <div class="diaBar" id="diaBar" hidden><label for="fDia">Entraram no dia</label><input type="date" id="fDia"></div>
    <div class="list" id="list"></div>
    <section class="detail" id="detail" hidden></section>
  </aside>

  <main>
    <canvas id="scene" aria-label="Mapa 3D da área dos aparelhos"></canvas>
    <div class="tip" id="tip" hidden></div>
    <div class="banner" id="banner" hidden><span>Toque no lugar onde o aparelho foi guardado</span><button class="btn" id="bCancelPick">Cancelar</button></div>
    <div class="views"><button class="btn" id="vTudo">Tudo</button><button class="btn" id="vGeral">Loja</button><button class="btn" id="vTopo">De cima</button><button class="btn" id="vOfic">Oficina</button><button class="btn" id="vExt">Área externa</button></div>
    <div class="note">Toque num aparelho para ver a OS, ou num lugar para ver o que tem nele.</div>
  </main>
</div>

<div class="overlay" id="ovReceber" hidden>
  <form class="sheet" id="fReceber" novalidate>
    <h3 id="fTitulo">Receber aparelho</h3>
    <div class="field"><label for="fOS">Número da OS</label><input id="fOS" inputmode="numeric" autocomplete="off" required></div>
    <div class="field"><label for="fAp">Aparelho</label><input id="fAp" autocomplete="off" placeholder="Ex.: Micro-ondas" required>
      <div class="tipos" id="tipos" role="group" aria-label="Tipos de aparelho"></div></div>
    <div class="field"><label for="fLocal">Onde foi guardado</label>
      <div class="pick"><span class="loc" id="fLocShow">—</span><button type="button" class="btn" id="fPick">Escolher no mapa</button></div>
      <select id="fLocal" aria-label="Lugar"></select></div>
    <div class="field"><label>Fotos de como chegou</label>
      <div class="fotobtns"><label class="btn">📷 Câmera<input id="fFotosCam" type="file" accept="image/*" capture="environment" hidden></label><label class="btn">🖼 Galeria<input id="fFotos" type="file" accept="image/*" multiple hidden></label></div>
      <div class="thumbs" id="fThumbs"></div></div>
    <p class="err" id="fErr" hidden></p>
    <div class="row"><button class="btn primary" type="submit" id="fSalvar">Salvar</button><button class="btn" type="button" id="fCancelar">Cancelar</button></div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="lock" id="lock" hidden>
  <form class="lockbox" id="lockForm" novalidate>
    <span class="tape lk" aria-hidden="true"></span>
    <h3>Mapa dos Aparelhos</h3>
    <p>Digite o código de acesso da equipe. Ele só é pedido uma vez neste aparelho.</p>
    <input id="lockIn" inputmode="numeric" autocomplete="one-time-code" aria-label="Código de acesso">
    <p class="err" id="lockErr" hidden></p>
    <button class="btn primary" type="submit" id="lockBtn">Entrar</button>
  </form>
</div>
<div class="viewer" id="viewer" hidden>
  <img id="vImg" alt="Foto do aparelho">
  <div class="bar"><button class="btn" id="vFechar">Fechar</button></div>
  <div class="nav"><button class="btn" id="vAnt">‹</button><span id="vPos"></span><button class="btn" id="vProx">›</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// =================== Atualização automática ===================
// Ao abrir (ou voltar para) o app, confere se há versão nova publicada e recarrega sozinho.
const VERSAO='2026-11-07c';
async function checarVersao(){ try{
  const t=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.text());
  const m=t.match(/const VERSAO='([^']+)'/); if(m && m[1]!==VERSAO){
    const k='mapa_recarregou_'+m[1]; if(!sessionStorage.getItem(k)){ sessionStorage.setItem(k,'1'); location.replace(location.pathname+'?v='+m[1]); } } }catch(e){} }
checarVersao(); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checarVersao(); });
// =================== Configuração do local 1 (metros) ===================
// x = leste (porta de grade em x=8), z = sul. Paredes aproximadas.
const PLANTA = [[0,0],[8,0],[8,5.2],[4.5,5.2],[4.5,3.4],[2.6,3.4],[2.6,4.05],[1.55,4.05],[1.55,3.4],[0,3.4]]; // vão embaixo da escada entre x 1.55 e 2.6
const PORTA = {lado:'leste', z0:1.7, z1:2.5};
// Estantes: niveis = andares abaixo do topo; numeração: topo primeiro, esquerda→direita, de cima pra baixo
const ESTANTES = [
  {g:'B', nome:'Estante 1', cx:6.75, cz:4.975, face:'-z', w:1.99, h:1.91, d:0.45, cols:3, niveis:4, cor:'white', cap:1, capTopo:1},
  {g:'C', nome:'Estante 2', cx:2.96, cz:0.27, face:'+z', w:2.14, h:1.74, d:0.52, cols:3, niveis:3, cor:'white', cap:5, capTopo:3},
  {g:'D', nome:'Estante 3', cx:3.355, cz:3.175, face:'-z', w:1.51, h:1.65, d:0.45, cols:2, niveis:3, cor:'wood', cap:4, capTopo:3},
];
// Áreas no chão (fita amarela)

function fazerMini(dataUrl){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,320/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.72)); }; img.onerror=()=>res(null); img.src=dataUrl; }); }
function imgMini(os){ const im=MIMG[os]; if(im) return (im.complete&&im.naturalWidth)?im:null; if(!MINI[os]) return null;
  const n=new Image(); n.onload=()=>{ montarCaixas(); destacar(); }; n.src=MINI[os]; MIMG[os]=n; return null; }
async function criarMini(os, dataUrl, enviar){ if(!FOTO_NAS_CAIXAS) return; if(MINI[os]||!dataUrl) return; const m=await fazerMini(dataUrl); if(!m) return; MINI[os]=m; guardarMinis();
  const r=DADOS.find(x=>x.os===os&&!x.ret); if(r) r.temMini=true; if(enviar&&NO_GOOGLE){ try{ await gas('salvarMini',os,m); }catch(e){} } }
async function sincMinis(){ if(!FOTO_NAS_CAIXAS||!NO_GOOGLE) return; const at=DADOS.filter(r=>!r.ret);
  const faltam=at.filter(r=>r.temMini&&!MINI[r.os]).map(r=>r.os);
  if(faltam.length){ try{ Object.assign(MINI, await gas('miniaturas',faltam)); guardarMinis(); montarCaixas(); destacar(); }catch(e){} }
  const semMini=at.filter(r=>!r.temMini&&!MINI[r.os]&&r.fotos.length).slice(0,3);
  for(const r of semMini){ try{ await criarMini(r.os, await srcFoto(r.fotos[0]), true); }catch(e){} }
  if(semMini.length){ montarCaixas(); destacar(); } }
function texFoto(os,img,w,h,cor){ const H=256, W=Math.max(64,Math.min(768,Math.round(H*w/h))); const k=os+'|'+cor+'|'+W;
  if(TEXC[k]) return TEXC[k]; const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const q=Math.min(img.width/W,img.height/H), sw=W*q, sh=H*q; g.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,W,H);
  const b=Math.max(3,Math.round(H*.022)); g.lineWidth=b*2; g.strokeStyle=cor; g.strokeRect(0,0,W,H);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; TEXC[k]=t; return t; }

  $('chips').innerHTML=`<button class="chip total" data-total="1" title="Mostrar todos os status">Total na loja <b>${ativos().length}</b></button>`+Object.entries(STATUS).map(([k,s])=>`<button class="chip" data-st="${k}" aria-pressed="${filtro.has(k)}"><i class="dot" style="background:var(${s.css})"></i>${s.nome} <b>${cont[k]||0}</b></button>`).join('');
}
$('chips').addEventListener('click',ev=>{ const b=ev.target.closest('.chip'); if(!b) return; if(b.dataset.total){ filtro=new Set(Object.keys(STATUS)); so90=false; tudo(); return; } const k=b.dataset.st;
  if(filtro.size===Object.keys(STATUS).length){ filtro=new Set([k]); } else if(filtro.has(k)){ filtro.delete(k); if(!filtro.size) filtro=new Set(Object.keys(STATUS)); } else filtro.add(k);
  tudo(); });
let ordem=(()=>{ try{ return localStorage.getItem('mapa_ordem')||'antigas'; }catch(e){ return 'antigas'; } })();
const DIAS_ALERTA=90;
const velho=r=>!r.ret && r.st!=='descarte' && (hoje-new Date(r.ent))>=DIAS_ALERTA*864e5;
const diaLocal=d=>{ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
let so90=false;
function lista(){
  const t=$('q').value.trim().toLowerCase();
  $('diaBar').hidden = aba!=='dia'; if(aba==='dia' && !$('fDia').value) $('fDia').value=diaLocal(hoje);
  const nVelhos=ativos().filter(velho).length; let rows;
  if(aba==='loja'){ rows=ativos().filter(r=>filtro.has(r.st)); if(so90) rows=rows.filter(velho); }
  else if(aba==='ret') rows=retirados();
  else rows=DADOS.filter(r=>diaLocal(r.ent)===$('fDia').value);
  if(lugarSel && !t) rows=rows.filter(r=>r.local===lugarSel);
  if(t) rows=rows.filter(r=>r.os.includes(t)||r.ap.toLowerCase().includes(t)||LUGAR[r.local].curto.toLowerCase()===t);
  const num=o=>{ const n=parseInt(String(o).replace(/\D/g,''),10); return isNaN(n)?Infinity:n; };
  rows.sort((a,b)=> aba==='dia' ? new Date(a.ent)-new Date(b.ent) : aba==='loja' ? (ordem==='antigas' ? num(a.os)-num(b.os) : num(b.os)-num(a.os)) || new Date(a.ent)-new Date(b.ent) : new Date(b.ret)-new Date(a.ret));
  $('bOrdem').hidden = aba!=='loja'; $('bOrdem').textContent = ordem==='antigas' ? '↑ Antigas' : '↓ Novas';
  const topo = aba==='loja' && nVelhos ? `<button class="alerta90" id="b90" aria-pressed="${so90}">⚠ ${nVelhos} ${nVelhos===1?'aparelho está':'aparelhos estão'} há mais de ${DIAS_ALERTA} dias na loja — ${so90?'mostrar todos':'ver quais'}</button>` : '';
  $('list').innerHTML = topo + (rows.length ? rows.map(r=>`<button class="item${r.os===selOS?' sel':''}${velho(r)?' velho':''}" data-os="${r.os}">
      <i class="dot" style="background:var(${STATUS[r.st].css})"></i><span class="os">OS ${esc(r.os)}</span><span class="loc">${r.ret?'Entregue':esc(LUGAR[r.local].curto)}</span>
      <span class="sub">${esc(r.ap)} · ${r.ret?'retirado '+fmt(r.ret):velho(r)?`<b>na loja ${ha(r.ent)}</b>`:aba==='dia'?STATUS[r.st].nome.toLowerCase():STATUS[r.st].nome.toLowerCase()+' '+ha(r.stDt)}</span></button>`).join('')
    : `<div class="empty">${lugarSel&&!t?`Nada guardado em ${esc(LUGAR[lugarSel].desc)}.`:t?`Nenhuma OS encontrada para “${esc(t)}”.`:(aba==='loja'?'Nenhum aparelho com esse status.':aba==='ret'?'Nenhum aparelho retirado nos últimos 30 dias.':'Nenhum aparelho entrou nesse dia.')}</div>`);
}
$('list').addEventListener('click',ev=>{ if(ev.target.closest('#b90')){ so90=!so90; lista(); return; } const b=ev.target.closest('.item'); if(b) selecionar(b.dataset.os); });
$('fDia').addEventListener('change',()=>{ selOS=null; tudo(); });
$('q').addEventListener('input',()=>{ lugarSel=null; lista(); });
$('q').addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ const f=$('list').querySelector('.item'); if(f) selecionar(f.dataset.os); }});
$('bOrdem').onclick=()=>{ ordem = ordem==='antigas'?'novas':'antigas'; try{ localStorage.setItem('mapa_ordem',ordem); }catch(e){} lista(); };
const abaSet=a=>{ aba=a; [['tLoja','loja'],['tRet','ret'],['tDia','dia']].forEach(([id,k])=>$(id).setAttribute('aria-selected',String(k===a))); selOS=null; tudo(); };
$('tLoja').onclick=()=>abaSet('loja'); $('tRet').onclick=()=>abaSet('ret'); $('tDia').onclick=()=>abaSet('dia');

function registro(os){ return DADOS.find(r=>r.os===os && (aba==='ret'?r.ret: aba==='dia'? diaLocal(r.ent)===$('fDia').value : !r.ret)); }
function selecionar(os){ if(os!==selOS){ editando=false; excluindo=false; } selOS=os; const r=registro(os); tudo(); if(r && !r.ret) focarLugar(r.local); if(innerWidth<=780) setTimeout(()=>$('detail').scrollIntoView({behavior:'smooth',block:'start'}),60); }
let confirmando=false, editando=false, excluindo=false;
function detalhe(){ detalhe0(); carregarFotos(); }
function detalhe0(){
  const r=selOS && registro(selOS), el=$('detail'); if(!r){ el.hidden=true; return; } el.hidden=false;
  const L=LUGAR[r.local];
  const fotos=r.fotos.map((f,i)=>`<img class="thumb" data-id="${esc(f)}" data-i="${i}" alt="Foto ${i+1} da OS ${esc(r.os)}">`).join('');
  if(r.ret){
    const ate=new Date(new Date(r.ret).getTime()+30*864e5);
    el.innerHTML=`<div class="d-head"><h2>${esc(r.ap)}</h2><span class="d-os">OS ${esc(r.os)}</span></div>
      <div class="meta"><span>Entrou <b>${fmt(r.ent)}</b></span><span>Retirado <b>${fmt(r.ret)}</b></span><span>Fotos guardadas até <b>${fmt(ate)}</b></span></div>
      <span class="k">Fotos da entrada</span><div class="thumbs">${fotos||'<span class="k" style="text-transform:none;letter-spacing:0">Sem fotos.</span>'}</div>`;
    return;
  }
  el.innerHTML=`<div class="d-head"><h2>${esc(r.ap)}</h2><span class="d-os">OS ${esc(r.os)}</span></div>
    <div class="where"><span class="big">${esc(L.curto)}</span><span class="txt">${esc(L.pos)}</span></div>
    <div class="stbtns">${Object.entries(STATUS).map(([k,s])=>`<button class="stb" data-st="${k}" aria-pressed="${r.st===k}" style="color:var(${s.css})"><i class="dot" style="background:var(${s.css})"></i><span style="color:var(--fg)">${s.nome}</span></button>`).join('')}</div>
    <div class="meta"><span>Entrou <b>${fmt(r.ent)}</b> (${ha(r.ent)})</span><span>Status desde <b>${fmt(r.stDt)}</b></span></div>
    ${velho(r)?`<div class="aviso90">⚠ Este aparelho está na loja ${ha(r.ent)} (mais de ${DIAS_ALERTA} dias). Avisar o cliente antes de passar para Descarte.</div>`:''}
    <span class="k">Fotos da entrada</span>
    <div class="thumbs">${fotos}<label class="addph">📷<br>câmera<input type="file" accept="image/*" capture="environment" hidden id="dFotosCam"></label><label class="addph">🖼<br>galeria<input type="file" accept="image/*" multiple hidden id="dFotos"></label></div>
    ${editando?`<div class="confirm editbox"><b>Corrigir dados da OS</b>
      <div class="field"><label for="eOS">Número da OS</label><input id="eOS" inputmode="numeric" autocomplete="off" value="${esc(r.os)}"></div>
      <div class="field"><label for="eAp">Aparelho</label><input id="eAp" autocomplete="off" value="${esc(r.ap)}">
        <div class="tipos" id="eTipos">${TIPOS.map(t=>`<button type="button" class="tipo${t.toLowerCase()===String(r.ap).toLowerCase()?' on':''}">${t}</button>`).join('')}</div></div>
      <p class="err" id="eErr" hidden></p>
      <div class="row"><button class="btn primary" id="eSalvar">Salvar correção</button><button class="btn" id="eCancelar">Cancelar</button></div></div>`
    :excluindo?`<div class="confirm">Excluir a OS ${esc(r.os)} (${esc(r.ap)})? Use só para aparelho descartado ou cadastrado por engano. Ele sai do mapa e da lista; a linha fica guardada na aba "Excluídos" da planilha.
      <p class="err" id="xErr" hidden></p>
      <div class="row"><button class="btn danger" id="xSim">Excluir</button><button class="btn" id="xNao">Cancelar</button></div></div>`
    :confirmando?`<div class="confirm">Confirmar que a OS ${esc(r.os)} foi entregue ao cliente? O aparelho sai do mapa e as fotos ficam guardadas por 30 dias.
      <div class="row"><button class="btn danger" id="dSim">Confirmar entrega</button><button class="btn" id="dNao">Cancelar</button></div></div>`
    :`<div class="row"><button class="btn" id="dEditar">Editar</button><button class="btn" id="dMover">Mudar de lugar</button><button class="btn primary" id="dEntregar">Entregue ao cliente</button><button class="btn danger" id="dExcluir">Excluir</button></div>`}`;
}
$('detail').addEventListener('click',async ev=>{
  const r=registro(selOS); if(!r) return;
  const sb=ev.target.closest('.stb'); if(sb && sb.dataset.st!==r.st){ r.st=sb.dataset.st; r.stDt=new Date().toISOString(); await API.salvar(r); tudo(); return; }
  const th=ev.target.closest('.thumb'); if(th){ abrirFoto(r.fotos,+th.dataset.i); return; }
  if(ev.target.id==='dEditar'){ editando=true; confirmando=false; detalhe(); setTimeout(()=>$('eOS')?.focus(),50); return; }
  if(ev.target.id==='eCancelar'){ editando=false; detalhe(); return; }
  const tp=ev.target.closest('#eTipos .tipo'); if(tp){ $('eAp').value=tp.textContent; $('eTipos').querySelectorAll('.tipo').forEach(b=>b.classList.toggle('on',b===tp)); return; }
  if(ev.target.id==='eSalvar'){
    const os=$('eOS').value.trim(), ap=$('eAp').value.trim(), e=$('eErr');
    const erro = !os?'Digite o número da OS.': !ap?'Digite qual é o aparelho.': (os!==r.os && ativos().some(x=>x.os===os))?`A OS ${os} já está no mapa.`:'';
    if(erro){ e.textContent=erro; e.hidden=false; return; }
    if(os===r.os && ap===r.ap){ editando=false; detalhe(); return; }
    ev.target.disabled=true; ev.target.textContent='Salvando…';
    try{ const antiga=r.os; await API.editar(antiga, {os, ap}); if(MINI[antiga]&&antiga!==os){ MINI[os]=MINI[antiga]; delete MINI[antiga]; }
      editando=false; selOS=os; tudo(); }
    catch(err){ e.textContent='Não consegui salvar: '+(err.message||err); e.hidden=false; ev.target.disabled=false; ev.target.textContent='Salvar correção'; }
    return; }
  if(ev.target.id==='dExcluir'){ excluindo=true; confirmando=false; editando=false; detalhe(); return; }
  if(ev.target.id==='xNao'){ excluindo=false; detalhe(); return; }
  if(ev.target.id==='xSim'){ ev.target.disabled=true; ev.target.textContent='Excluindo…';
    try{ await API.excluir(r.os); excluindo=false; selOS=null; tudo(); aviso(`OS ${r.os} excluída.`); }
    catch(err){ const e=$('xErr'); e.textContent='Não consegui excluir: '+(err.message||err); e.hidden=false; ev.target.disabled=false; ev.target.textContent='Excluir'; }
    return; }
  if(ev.target.id==='dEntregar'){ confirmando=true; detalhe(); }
  if(ev.target.id==='dNao'){ confirmando=false; detalhe(); }
  if(ev.target.id==='dSim'){ r.ret=new Date().toISOString(); await API.salvar(r); confirmando=false; selOS=null; tudo(); }
  if(ev.target.id==='dMover'){ iniciarEscolha(id=>{ r.local=id; API.salvar(r); tudo(); focarLugar(id); }); }
});
$('detail').addEventListener('change',async ev=>{ if(ev.target.id!=='dFotos'&&ev.target.id!=='dFotosCam') return; const r=registro(selOS);
  let pri=null; for(const f of ev.target.files){ const d=await reduzir(f); pri=pri||d; r.fotos.push(await API.foto(r.os, d)); } await API.salvar(r); if(pri) await criarMini(r.os, pri, true); detalhe(); montarCaixas(); destacar(); });

function tudo(){ chips(); lista(); detalhe(); montarCaixas(); destacar(); }

// =================== Fotos ===================
function reduzir(file,max=1280,q=.72){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg',q)); }; img.onerror=rej; img.src=URL.createObjectURL(file); }); }
let vList=[],vI=0;
async function abrirFoto(l,i){ vList=l; vI=i; $('vImg').removeAttribute('src'); $('vImg').src=await srcFoto(l[i]); $('vPos').textContent=`${i+1} de ${l.length}`; $('viewer').hidden=false; }
$('vFechar').onclick=()=>$('viewer').hidden=true;
$('vAnt').onclick=()=>abrirFoto(vList,(vI-1+vList.length)%vList.length);
$('vProx').onclick=()=>abrirFoto(vList,(vI+1)%vList.length);

// =================== Receber aparelho ===================
$('tipos').innerHTML=TIPOS.map(t=>`<button type="button" class="tipo">${t}</button>`).join('');
function marcaTipo(){ const v=$('fAp').value.trim().toLowerCase(); $('tipos').querySelectorAll('.tipo').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===v)); }
$('tipos').addEventListener('click',ev=>{ const b=ev.target.closest('.tipo'); if(!b) return; $('fAp').value=b.textContent; $('fAp').dispatchEvent(new Event('input')); });
let novasFotos=[];
function ocupacao(id){ return ativos().filter(r=>r.local===id).length; }
function opcoesLocal(){
  $('fLocal').innerHTML='<option value="">Escolher da lista…</option>'+Object.values(LUGAR).map(L=>{ const o=ocupacao(L.id); return `<option value="${L.id}">${L.curto} — ${L.pos} (${o} aqui)</option>`; }).join('');
}
function sugerir(ap){ return '';
  const p=PREF.find(([re])=>re.test(ap)); const g=p?p[1]:'C';
  if(LUGAR[g]) return g; // área do chão única
  const cand=Object.values(LUGAR).filter(L=> L.tipo==='nicho' ? (L.est.g===g && L.r>0) : L.z.grupo===g);
  return (cand.find(L=>ocupacao(L.id)<L.cap) || cand.sort((a,b)=>ocupacao(a.id)-ocupacao(b.id))[0])?.id || '';
}
function setLocal(id){ $('fLocal').value=id; $('fLocShow').textContent=id?LUGAR[id].desc:'—'; }
let autoLocal=true;
$('fAp').addEventListener('input',()=>{ marcaTipo(); if(autoLocal) setLocal(sugerir($('fAp').value)); });
$('fLocal').addEventListener('change',()=>{ autoLocal=false; setLocal($('fLocal').value); });
$('bReceber').onclick=()=>{ $('fReceber').reset(); novasFotos=[]; $('fThumbs').innerHTML=''; $('fErr').hidden=true; autoLocal=true; marcaTipo(); opcoesLocal(); setLocal(''); $('ovReceber').hidden=false; setTimeout(()=>$('fOS').focus(),50); };
$('fCancelar').onclick=()=>{ $('ovReceber').hidden=true; };
const addFotosForm=async ev=>{ for(const f of ev.target.files){ novasFotos.push(await reduzir(f)); } ev.target.value='';
  $('fThumbs').innerHTML=novasFotos.map((f,i)=>`<img class="thumb" src="${f}" alt="Foto ${i+1}">`).join(''); };
$('fFotos').addEventListener('change',addFotosForm); $('fFotosCam').addEventListener('change',addFotosForm);
$('fPick').onclick=()=>{ $('ovReceber').hidden=true; iniciarEscolha(id=>{ autoLocal=false; setLocal(id); $('ovReceber').hidden=false; }, ()=>{ $('ovReceber').hidden=false; }); };
$('fReceber').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const os=$('fOS').value.trim(), ap=$('fAp').value.trim(), local=$('fLocal').value;
  const erro = !os?'Digite o número da OS.': !ap?'Digite qual é o aparelho.': !local?'Escolha onde o aparelho foi guardado.': ativos().some(r=>r.os===os)?`A OS ${os} já está no mapa (${LUGAR[ativos().find(r=>r.os===os).local].desc}).`:'';
  if(erro){ $('fErr').textContent=erro; $('fErr').hidden=false; return; }
  $('fSalvar').disabled=true; $('fSalvar').textContent='Salvando…';
  const agora=new Date().toISOString(); const fotos=[]; for(const f of novasFotos) fotos.push(await API.foto(os,f));
  await API.salvar({os, ap, local, st:'aguardando', ent:agora, stDt:agora, fotos});
  if(novasFotos.length) await criarMini(os, novasFotos[0], true);
  $('fSalvar').disabled=false; $('fSalvar').textContent='Salvar'; $('ovReceber').hidden=true;
  aba='loja'; $('tLoja').click(); selecionar(os);
});

// =================== Escolher lugar no mapa ===================
let aoCancelar=null;
function iniciarEscolha(cb,cancel){ escolhendo=cb; aoCancelar=cancel||null; $('banner').hidden=false; vGeral(); }
$('bCancelPick').onclick=()=>{ escolhendo=null; $('banner').hidden=true; aoCancelar&&aoCancelar(); };

// =================== Interação 3D ===================
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(ev){ const r=canvas.getBoundingClientRect(); mouse.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1); ray.setFromCamera(mouse,camera);
  if(!escolhendo){ const c=ray.intersectObjects(Object.values(caixas),false); if(c.length) return {os:c[0].object.userData.os}; }
  const h=ray.intersectObjects(hits,false); return h.length?{lugar:h[0].object.userData.lugar}:null; }
let down=null; canvas.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
canvas.addEventListener('pointerup',e=>{ if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6) return; const p=pick(e); if(!p) return;
  if(escolhendo){ const cb=escolhendo; escolhendo=null; $('banner').hidden=true; cb(p.lugar); return; }
  if(p.os){ if(aba!=='loja') $('tLoja').click(); selecionar(p.os); return; }
  $('q').value=''; if(aba!=='loja') $('tLoja').click(); selOS=null; lugarSel=p.lugar; tudo(); focarLugar(p.lugar); LUGAR[p.lugar].hit.material.opacity=.16; });
canvas.addEventListener('pointermove',e=>{ const tip=$('tip'); if(e.pointerType!=='mouse'){tip.hidden=true;return;} const p=pick(e);
  hits.forEach(h=>{ if(h.material.opacity<.15) h.material.opacity=0; });
  if(!p){ tip.hidden=true; canvas.style.cursor=''; return; } canvas.style.cursor='pointer';
  let txt; if(p.os){ const r=ativos().find(x=>x.os===p.os); txt=`OS ${r.os} · ${r.ap}`; } else { const L=LUGAR[p.lugar]; if(L.hit.material.opacity<.15) L.hit.material.opacity=.1; { const o=ocupacao(L.id); txt=`${L.desc} · ${o} aparelho${o===1?'':'s'}`; } }
  const rc=canvas.getBoundingClientRect(); tip.textContent=txt; tip.style.left=(e.clientX-rc.left)+'px'; tip.style.top=(e.clientY-rc.top)+'px'; tip.hidden=false; });
canvas.addEventListener('pointerleave',()=>$('tip').hidden=true);
$('vTudo').onclick=vTudo; $('vGeral').onclick=vGeral; $('vTopo').onclick=vTopo; $('vOfic').onclick=vOfic; $('vExt').onclick=vExt;

// =================== Tema + loop ===================
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',temaMats);
new MutationObserver(temaMats).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){ const r=canvas.parentElement.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas.parentElement); resize();
function loop(now){ if(anim){ const t=Math.min(1,(now-anim.s)/anim.ms),k=ease(t); camera.position.lerpVectors(anim.p0,anim.p1,k); controls.target.lerpVectors(anim.t0,anim.t1,k); if(t>=1) anim=null; }
  if(pin.visible) pin.children.forEach((c,i)=>{ c.position.y=(i?.14:0)+Math.sin(now/280)*.03; });
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop); }
if(NO_GOOGLE) $('modo').hidden=true;
requestAnimationFrame(loop); tudo();
async function atualizar(){ if(escolhendo || !$('ovReceber').hidden) return; try{ await API.listar(); sincMinis(); if(selOS && !registro(selOS)) selOS=null; chips(); lista(); if(!confirmando && !editando) detalhe(); montarCaixas(); destacar(); $('sync').textContent=''; }catch(e){ $('sync').textContent='sem conexão'; } }
$('lockForm').addEventListener('submit',async ev=>{ ev.preventDefault(); const c=$('lockIn').value.trim(); if(!c) return;
  salvarCodigo(c); lerCodigo.tentou=true; $('lockBtn').disabled=true; $('lockBtn').textContent='Entrando…';
  try{ await API.listar(); $('lock').hidden=true; tudo(); }catch(e){ if(e.message!=='codigo'){ $('lockErr').textContent='Sem conexão. Tente de novo.'; $('lockErr').hidden=false; } }
  $('lockBtn').disabled=false; $('lockBtn').textContent='Entrar'; });
if(EM_SITE && !lerCodigo()) mostrarLock('');
if(NO_GOOGLE){ $('list').innerHTML='<div class="empty">Carregando…</div>'; if(!EM_SITE || lerCodigo()) atualizar(); setInterval(atualizar,60000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) atualizar(); }); }
</script>

</body></html>
